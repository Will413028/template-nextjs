name: Dependabot auto-merge

# A Dependabot patch update merges into dev by itself once the required checks pass (the dev ruleset requires
# gate (ci)); minor and major updates wait for a person. Merging into dev deploys nothing.
on: pull_request

permissions: {}

jobs:
  automerge:
    name: Auto-merge a patch update
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
