version: 2

# Wait a week before proposing a new release, so a compromised version has time
# to be caught and yanked before it lands here.
updates:
  - package-ecosystem: github-actions
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # node in the Dockerfile, pinned by digest
  - package-ecosystem: docker
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # postgres and caddy in docker-compose.yml (the integration tests pin the same postgres digest in
  # test/integration/postgres.ts: update it with the compose file)
  - package-ecosystem: docker-compose
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    target-branch: dev
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # @types/node follows the Node.js major the app runs on (Dockerfile, CI); its major moves with the Node.js
    # upgrade, not on its own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
