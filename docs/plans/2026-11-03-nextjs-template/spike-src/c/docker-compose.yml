name: spike-c
x-db-names: &db-names
  POSTGRES_DB: spike
  DB_OWNER_USER: spike_owner
  DB_APP_USER: spike_app
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    logging: *logging
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      <<: *db-names
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, db_owner_password, db_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15

  # stand-in for the D1 migration tool: runs as the owner role, grants the app role
  migrate:
    logging: *logging
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    entrypoint: ["sh", "-c", "PGPASSWORD=$$(cat /run/secrets/db_owner_password) psql -v ON_ERROR_STOP=1 -h postgres -U spike_owner -d spike -f /migrate.sql"]
    volumes: ["./migrate.sql:/migrate.sql:ro"]
    secrets: [db_owner_password]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  app:
    logging: *logging
    build:
      context: ./app
      args:
        NEXT_PUBLIC_APP_URL: https://build-time.example
    image: spike-c-app
    stop_grace_period: 35s
    environment:
      NEXT_PUBLIC_APP_URL: https://runtime.example
      SPIKE_RUNTIME: runtime-value
      DB_HOST: postgres
      DB_NAME: spike
      DB_USER: spike_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_app_password]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    logging: *logging
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["18080:80", "18443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: { app: { condition: service_healthy } }

secrets:
  postgres_password: { file: .secrets/postgres_password }
  db_owner_password: { file: .secrets/db_owner_password }
  db_app_password: { file: .secrets/db_app_password }
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
