# Python: the check scripts in scripts/. make py-tools installs ruff.
target-version = "py312"
# >>> template-only
# also the project generator; the plan's spike sources are frozen evidence (AGENTS.md), not code this repository checks
extend-exclude = ["docs/plans"]
# <<< template-only
line-length = 120

[lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
  "C90",     # cyclomatic complexity
  "PLR09",   # too many arguments, branches, statements
  "BLE",     # blind except
  "S",       # security
  "DTZ",     # naive datetimes
  "FBT",     # boolean positional arguments
  "TID",     # banned imports
  "PGH004",  # a blanket noqa
  "RUF100",  # a noqa that suppresses nothing
]
ignore = [
  "S603", "S607",  # these scripts run git and other tools on purpose, never with a shell
]

[lint.per-file-ignores]
"**/test_*.py" = ["S101", "PLR2004", "FBT"]
# http_get refuses anything but https before urlopen; S310 cannot see a check on a URL it does not read as a literal
"scripts/tool_versions.py" = ["S310"]

[lint.mccabe]
max-complexity = 10
