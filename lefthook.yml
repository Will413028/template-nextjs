pre-commit:
  parallel: true
  commands:
    prevent-env-leak:
      tags: security
      run: >-
        git diff --cached --name-only | grep -E '^(\.env(\..*)?|\.secrets/.*)$' | grep -vx '.env-example' &&
        echo "Error: .env and .secrets/ hold credentials and are never committed." &&
        exit 1 || exit 0
    lint:
      glob: "*.{ts,tsx,mts,mjs,cjs,json}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      priority: 1
    types:
      glob: "*.{ts,tsx,mts}"
      run: pnpm exec tsc --noEmit
      priority: 2

# CI's checks, minus the jobs that start containers (integration tests, compose stack):
# a push is stopped here even when CI has not run yet. The security tools are local binaries (brew install actionlint zizmor gitleaks osv-scanner).
pre-push:
  parallel: true
  commands:
    app:
      run: pnpm audit --prod --audit-level high && pnpm check
    # before the first push there is no origin/main: nothing has been released, so there is nothing to compare
    migrations-immutable:
      run: >-
        if git rev-parse -q --verify origin/main > /dev/null; then python3 scripts/check_migrations.py --base origin/main;
        else python3 scripts/check_migrations.py; fi
    docker-lint:
      run: make --no-print-directory lint-docker
    policy:
      run: >-
        python3 -m unittest discover -s scripts -p 'test_*.py' &&
        if git rev-parse -q --verify origin/main > /dev/null; then range=origin/main..HEAD; else range=HEAD; fi &&
        python3 scripts/check_commit_policy.py --range "$range"
    # >>> template-only
    # the generator's own tests (CI's generate job also checks a generated project end to end)
    template:
      run: python3 -m unittest discover -s template -p 'test_*.py'
    # <<< template-only
    # osv-scanner gets each tracked lockfile by name: its recursive walk honours a parent repository's .gitignore,
    # so a clone nested in an ignored directory would scan nothing and fail.
    # >>> template-only
    # The step 0 spike lockfiles under docs/plans/ are a frozen record that nothing installs, so they are not scanned.
    # <<< template-only
    security:
      run: >-
        actionlint && zizmor --offline .github/workflows && gitleaks git --redact --no-banner . &&
        osv-scanner scan source $(git ls-files 'pnpm-lock.yaml' ':!:docs/**' | sed 's/^/-L /')

commit-msg:
  commands:
    # a commit that edits a checker's configuration or moves a lock the bad way names why (CI checks every commit)
    quality-gate-reason:
      run: python3 scripts/check_commit_policy.py --commit-msg {1}
    conventional-commit:
      run: |
        first_line="$(head -n1 {1})"
        if [[ "$first_line" =~ ^(fixup|squash)!\  ]]; then exit 0; fi
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?!?: .+'
        if ! [[ "$first_line" =~ $pattern ]]; then
          echo "commit message does not follow Conventional Commits" >&2
          echo "format: <type>(<scope>)?: <subject> (feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)" >&2
          echo "got: $first_line" >&2
          exit 1
        fi
        subject="${first_line#*: }"
        if [[ "${subject:0:1}" =~ [A-Z] ]]; then
          echo "commit subject must not start with a capital letter" >&2
          exit 1
        fi
        if [[ "$subject" == *. ]]; then
          echo "commit subject must not end with a period" >&2
          exit 1
        fi
